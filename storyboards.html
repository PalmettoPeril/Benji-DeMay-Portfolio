<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Benji DeMay | Storyboards</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="avatar-wrap">
          <div class="avatar">AR</div>
        </div>

        <div class="brand-block">
          <h1>Benji DeMay</h1>
          <p>Animator • Illustrator • Storyboard Artist</p>
        </div>

        <nav class="nav" aria-label="Main navigation">
          <a href="index.html">Home</a>
          <a href="animation.html">Animation</a>
          <a href="character-design.html">Character Design</a>
          <a href="illustration.html">Illustration</a>
          <a class="active" href="storyboards.html">Storyboards</a>
        </nav>

        <div class="sidebar-meta">
          <center><a href="https://www.youtube.com/@palmettoperil6049">Youtube</a></center>
          <center><a href="https://www.linkedin.com/in/benji-demay-235401294/">LinkedIn</a></center>
          <center><a href="https://www.instagram.com/palmettoperil/?hl=en">Instagram</a></center>
          <center><a href="mailto:benjidemay@gmail.com">Email</a></center>
        </div>
      </aside>

      <main class="content storyboard-page">
        <header class="mobile-header">
          <button class="nav-toggle" aria-label="Open menu" aria-expanded="false">
            <span></span>
            <span></span>
            <span></span>
          </button>
        </header>

        <section class="page-intro">
          <h2>Storyboards</h2>
        </section>

        <section class="storyboard-grid">
          <article class="storyboard-card" data-images="storyboard-1a.jpg|storyboard-1b.jpg|storyboard-1c.jpg">
            <button class="storyboard-trigger" type="button">
              <img src="storyboard-1a.jpg" alt="Storyboard sequence 1" />
            </button>
            <div class="storyboard-meta">
              <h3>Sequence 01</h3>
              <p>Opening beat</p>
            </div>
          </article>

          <article class="storyboard-card" data-images="storyboard-2a.jpg|storyboard-2b.jpg|storyboard-2c.jpg|storyboard-2d.jpg">
            <button class="storyboard-trigger" type="button">
              <img src="storyboard-2a.jpg" alt="Storyboard sequence 2" />
            </button>
            <div class="storyboard-meta">
              <h3>Sequence 02</h3>
              <p>Action pacing</p>
            </div>
          </article>

          <article class="storyboard-card" data-images="storyboard-3a.jpg|storyboard-3b.jpg|storyboard-3c.jpg">
            <button class="storyboard-trigger" type="button">
              <img src="storyboard-3a.jpg" alt="Storyboard sequence 3" />
            </button>
            <div class="storyboard-meta">
              <h3>Sequence 03</h3>
              <p>Dialogue scene</p>
            </div>
          </article>

          <article class="storyboard-card" data-images="storyboard-4a.jpg|storyboard-4b.jpg|storyboard-4c.jpg|storyboard-4d.jpg">
            <button class="storyboard-trigger" type="button">
              <img src="storyboard-4a.jpg" alt="Storyboard sequence 4" />
            </button>
            <div class="storyboard-meta">
              <h3>Sequence 04</h3>
              <p>Final beat</p>
            </div>
          </article>
        </section>
      </main>
    </div>

    <div id="lightbox" class="lightbox" aria-hidden="true">
      <button class="lightbox-close" aria-label="Close lightbox">Close</button>
      <button class="lightbox-prev" aria-label="Previous image">&#10094;</button>
      <img id="lightbox-image" src="" alt="" />
      <button class="lightbox-next" aria-label="Next image">&#10095;</button>
      <div id="lightbox-counter" class="lightbox-counter">1 / 1</div>
    </div>

    <script>
      const navToggle = document.querySelector(".nav-toggle");
      const sidebar = document.querySelector(".sidebar");

      if (navToggle && sidebar) {
        navToggle.addEventListener("click", () => {
          sidebar.classList.toggle("open");
          const isOpen = sidebar.classList.contains("open");
          navToggle.setAttribute("aria-expanded", isOpen ? "true" : "false");
        });
      }

      const lightbox = document.getElementById("lightbox");
      const lightboxImage = document.getElementById("lightbox-image");
      const closeButton = document.querySelector(".lightbox-close");
      const prevButton = document.querySelector(".lightbox-prev");
      const nextButton = document.querySelector(".lightbox-next");
      const counter = document.getElementById("lightbox-counter");

      let currentImages = [];
      let currentIndex = 0;

      document.querySelectorAll(".storyboard-trigger").forEach((trigger) => {
        trigger.addEventListener("click", () => {
          const card = trigger.closest(".storyboard-card");
          currentImages = card.dataset.images.split("|");
          currentIndex = 0;
          showImage(currentIndex);
          lightbox.classList.add("open");
          lightbox.setAttribute("aria-hidden", "false");
        });
      });

      function showImage(index) {
        currentIndex = index;
        lightboxImage.src = currentImages[currentIndex];
        counter.textContent = `${currentIndex + 1} / ${currentImages.length}`;
      }

      prevButton.addEventListener("click", () => {
        if (!currentImages.length) return;
        currentIndex = (currentIndex - 1 + currentImages.length) % currentImages.length;
        showImage(currentIndex);
      });

      nextButton.addEventListener("click", () => {
        if (!currentImages.length) return;
        currentIndex = (currentIndex + 1) % currentImages.length;
        showImage(currentIndex);
      });

      closeButton.addEventListener("click", () => {
        lightbox.classList.remove("open");
        lightbox.setAttribute("aria-hidden", "true");
        lightboxImage.src = "";
        currentImages = [];
      });

      lightbox.addEventListener("click", (event) => {
        if (event.target === lightbox) {
          lightbox.classList.remove("open");
          lightbox.setAttribute("aria-hidden", "true");
          lightboxImage.src = "";
          currentImages = [];
        }
      });

      document.addEventListener("keydown", (event) => {
        if (!lightbox.classList.contains("open")) return;

        if (event.key === "Escape") {
          lightbox.classList.remove("open");
          lightbox.setAttribute("aria-hidden", "true");
          lightboxImage.src = "";
          currentImages = [];
        }

        if (event.key === "ArrowRight") {
          nextButton.click();
        }

        if (event.key === "ArrowLeft") {
          prevButton.click();
        }
      });
    </script>
  </body>
</html>
